name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: trialmark report examples/run-record.json --by-tag
      - run: trialmark run examples/config.json --by-tag --yes
      - run: trialmark gate examples/config-run-record.json --model perfect-model
      - name: Every starter writes and estimates with no SDK or key
        run: |
          for t in qa extraction classification summarisation calculation; do
            for p in anthropic openai; do
              trialmark init $t --provider $p --dir /tmp/s-$t-$p && trialmark run /tmp/s-$t-$p/config.json
            done
          done
