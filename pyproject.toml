[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trialmark"
version = "0.2.0"
description = "Model acceptance tests for language models: your own test set, a pass mark set before the run, and a record anyone can rerun."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "PE (peshwar9)" }]
keywords = ["llm", "evaluation", "benchmark", "model selection", "acceptance testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/peshwar9/trialmark"
Issues = "https://github.com/peshwar9/trialmark/issues"

[project.scripts]
trialmark = "trialmark.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trialmark"]
