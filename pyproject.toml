[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trialmark"
version = "0.3.1"
description = "An open-source framework for evaluating language models and acceptance-testing them for your task: your own test cases, a pass mark fixed before the results, and a reproducible record of accuracy, cost and speed."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "PE (peshwar9)" }]
keywords = ["llm", "evaluation", "benchmark", "model selection", "acceptance testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=2.5"]
openai = ["openai>=3.40"]
dev = ["pytest>=8", "jsonschema>=4.18"]

[project.urls]
Homepage = "https://github.com/peshwar9/trialmark"
Issues = "https://github.com/peshwar9/trialmark/issues"

[project.scripts]
trialmark = "trialmark.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trialmark"]
